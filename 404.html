<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <meta name="robots" content="noindex">
  <title>Page not found | Julius Odo-Eke</title>
  <base href="./">
  <script>
    (() => {
      const pathParts = location.pathname.split("/").filter(Boolean);
      pathParts.pop();
      document.querySelector("base").href = `/${pathParts.join("/")}${pathParts.length ? "/" : ""}`;
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=49">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="not-found">
    <div class="container">
      <p class="eyebrow" style="justify-content:center">Error 404</p>
      <h1><span class="text-gradient">Page not found.</span></h1>
      <p class="section-intro">There is nothing at this address. Go back to the portfolio.</p>
      <p><a class="button button-primary" href="index.html">Back to the portfolio <span aria-hidden="true">↗</span></a></p>
    </div>
  </main>
</body>
</html>
