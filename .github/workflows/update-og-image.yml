# Rebuilds the social preview card whenever the profile photo changes.
# Triggers: replacing assets/images/julius-odoeke.*, uploading through the admin panel
# (assets/uploads, content/site-settings.json), or running it by hand from the Actions tab.
name: Update social preview image

on:
  push:
    branches: [main]
    paths:
      - "assets/images/julius-odoeke.*"
      - "assets/uploads/**"
      - "content/site-settings.json"
      - "tools/generate_og_image.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-og-image
  cancel-in-progress: false

jobs:
  og-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/generate_og_image.py
      - name: Commit the new preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/og-cover.png index.html
          if git diff --cached --quiet; then
            echo "Preview image already up to date."
          else
            git commit -m "Update social preview image from profile photo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
