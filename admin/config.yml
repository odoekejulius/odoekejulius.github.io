# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: odoekejulius/odoekejulius.github.io
  branch: main
  auth_methods: [token]

media_folder: /assets/uploads
public_folder: /assets/uploads

collections:
  - name: site_settings
    label: Site settings
    files:
      - name: profile
        label: Profile
        file: /content/site-settings.json
        fields:
          - { label: Author portrait, name: portrait_image, widget: image }
          - { label: Portrait description (alt text), name: portrait_alt, widget: string }

  - name: website_projects
    label: Website projects
    label_singular: Website project
    file: /content/website-projects.json
    identifier_field: title
    description: New projects appear in the Website projects section. Only the first three show initially; visitors can expand the list. Uploaded media is public.
    fields:
      - { label: Project title, name: title, widget: string }
      - { label: Year, name: year, widget: string, required: false }
      - { label: Short write-up, name: description, widget: text }
      - { label: Main screenshot, name: image, widget: image, required: false }
      - { label: Screenshot description (alt text), name: image_alt, widget: string, required: false }
      - label: Additional screenshots
        name: screenshots
        widget: list
        required: false
        fields:
          - { label: Screenshot, name: image, widget: image }
          - { label: Caption, name: caption, widget: string }
      - label: Highlights
        name: highlights
        widget: list
        required: false
        field: { label: Highlight, name: highlight, widget: string }
      - label: Technologies
        name: tags
        widget: list
        required: false
        field: { label: Technology, name: tag, widget: string }
      - { label: Project URL or downloadable file URL, name: live_url, widget: string, required: false }

  - name: analytics_projects
    label: Data analytics projects
    label_singular: Analytics project
    file: /content/analytics-projects.json
    identifier_field: title
    description: New projects appear in the Data analytics section. Upload a ZIP with public-safe analysis outputs; the site previews common data, report, image, and source files. The ZIP itself is public. Never upload student-level, identity, employment, client, or other private records.
    fields:
      - { label: Project title, name: title, widget: string }
      - { label: Year, name: year, widget: string, required: false }
      - label: Analysis project files (ZIP)
        name: project_package_url
        widget: file
        accept: ".zip,application/zip"
        required: true
        media_libraries:
          default:
            config:
              max_file_size: 15728640
        hint: "The public ZIP may contain HTML, CSV, Excel, PDF/Word/PowerPoint reports, images, and source-code files. The site previews files inside the collapsed project card. Upload only data and records that are safe for the public; never include private person-level, student, identity, employment, client, or confidential files."

  - name: media
    label: Videos and media
    label_singular: Video or media item
    file: /content/media.json
    identifier_field: title
    description: Add a YouTube link or upload a small video. All published media is public.
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: YouTube URL, name: youtube_url, widget: string, required: false }
      - { label: "Video file (MP4, WebM or Ogg; small files only)", name: video_file, widget: file, accept: "video/mp4,video/webm,video/ogg", required: false }
      - { label: Cover image, name: cover_image, widget: image, required: false }
